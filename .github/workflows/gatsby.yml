    <section id="about"><div class="shell"><div class="section-head"><span class="section-label">01 / ABOUT</span><div><h3>საიმედო მხარდაჭერა, მკაფიო კომუნიკაცია და ვიზუალური ხედვა.</h3><p class="about-text">ჩემი პროფესიული გამოცდილება აერთიანებს მომხმარებლის ტექნიკურ მხარდაჭერას, სისტემების გამართვასა და ქსელურ ამოცანებს. პარალელურად, Motion Design საშუალებას მაძლევს იდეებს დინამიკური, დასამახსოვრებელი ვიზუალური ფორმა მივცე.</p></div></div><div class="skills"><div class="skill"><strong>IT მხარდაჭერა</strong><span>Hardware, software, ქსელი, მომხმარებლის მხარდაჭერა.</span></div><div class="skill"><strong>Microsoft 365</strong><span>Windows, Office, Teams, ანგარიშები და მოწყობილობები.</span></div><div class="skill"><strong>Motion & Visual</strong><span>ვიზუალური კონცეფციები და მოძრავი გრაფიკა.</span></div></div></div></section>
    <section id="experience"><div class="shell"><div class="experience"><span class="section-label">02 / EXPERIENCE</span><div><h3>პროფესიული გამოცდილება</h3><div class="timeline"><article class="role"><div class="date">2024 — PRESENT</div><div><h4>IT Support Engineer</h4><div class="company">Medison</div><p>კომპიუტერული ტექნიკის, პროგრამებისა და პერიფერიული მოწყობილობების გამართვა; ტექნიკური პრობლემების დიაგნოსტიკა და IT პროექტებში მონაწილეობა.</p></div></article><article class="role"><div class="date">2023 — 2024</div><div><h4>IT Support</h4><div class="company">Live Support</div><p>Hardware, software და ქსელური საკითხების დროული მოგვარება, remote/on-site მხარდაჭერა და მომხმარებლების საბაზისო ტრენინგი.</p></div></article><article class="role"><div class="date">2022 — 2023</div><div><h4>IT Support</h4><div class="company">Evex</div><p>სამუშაო სადგურების, პრინტერებისა და სკანერების გამართვა; Windows, Office და Teams-ის მხარდაჭერა; helpdesk მოთხოვნების მართვა.</p></div></article><article class="role"><div class="date">2021 — PRESENT</div><div><h4>Business Administration & Management</h4><div class="company">Ilia State University</div><p>ბაკალავრიატი ბიზნეს ადმინისტრირებასა და მენეჯმენტში.</p></div></article></div></div></div></div></section>
    <section id="work"><div class="shell"><div class="section-head"><span class="section-label">03 / FEATURED WORK</span><div><h3>ვიზუალური მხარე</h3><p class="about-text">ჩემი Behance პორტფოლიოდან შერჩეული გამორჩეული პროექტი.</p></div></div><a class="featured" href="https://www.behance.net/gallery/212411307/_" target="_blank" rel="noreferrer"><div class="work-image"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/9c8bb8212411307.6794e234719be.png" alt="საქართველოს ნაკრები — Behance პროექტი" /></div><div class="work-info"><div class="eyebrow">SELECTED ON BEHANCE</div><h3>საქართველოს ნაკრები</h3><p>სპორტული ვიზუალური პროექტი, რომელიც საქართველოს ნაკრებს ეძღვნება და პორტფოლიოსთვის მკაფიო, ენერგიულ აქცენტს ქმნის.</p><div class="tags"><span class="tag">GRAPHIC DESIGN</span><span class="tag">SPORT</span><span class="tag">CREATIVE</span></div><span class="button primary">იხილე Behance-ზე ↗</span></div></a></div></section>
