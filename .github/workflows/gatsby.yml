        <div><div class="eyebrow">IT SUPPORT ENGINEER / MOTION DESIGNER</div><h1>ტექნოლოგია<br />და <em>ვიზუალი</em><br />ერთ სივრცეში.</h1><p class="intro">გამარჯობა, მე ლუკა კაკაბაძე ვარ — IT Support Engineer გამოცდილებითა და მოძრავი გრაფიკის მიმართ განსაკუთრებული ინტერესით.</p><div class="actions"><a class="button primary" href="#contact">დამიკავშირდი</a><a class="button" href="#work">ნამუშევრის ნახვა ↓</a></div></div>
